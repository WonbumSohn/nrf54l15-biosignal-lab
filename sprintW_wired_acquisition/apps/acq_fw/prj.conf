# acq_fw 설정 (Configuration)

# uart20은 바이너리 프레임 전용 → 콘솔·로그 끔 (uart20 carries binary frames only)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# UART 비동기 API (EasyDMA) / UART async API
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# CRC-16/XMODEM
CONFIG_CRC=y

# LED
CONFIG_GPIO=y

# I2S (SPH0645)
CONFIG_I2S=y

# PDM 내장 마이크 (on-board PDM mic, dmic API)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# I2C: 내장 IMU(i2c30) + MAX30102(i2c22), 둘 다 레지스터 직접 접근 (raw I2C; Zephyr 센서 드라이버 안 씀)
CONFIG_I2C=y

# Decimation: CMSIS-DSP FIR (Cortex-M33 FPU, float32)
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y

# 스레드 스택 (mic 스레드에서 float 처리) / stacks
CONFIG_MAIN_STACK_SIZE=2048
