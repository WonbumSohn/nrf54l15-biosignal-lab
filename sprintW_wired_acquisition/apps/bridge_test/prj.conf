# Gate 0 bridge_test 설정 (Configuration)

# uart20(→ SAMD11 → USB)을 시험 프레임 전용으로 쓰기 위해 콘솔·로그·printk를 모두 끔
# Free uart20 (→ SAMD11 → USB) for test frames only: no console, log or printk
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
# CONFIG_PRINTK=n 은 다른 옵션이 강제로 y로 만듦 → 콘솔이 꺼져 있으면 printk는 출력되지 않으므로 생략
# PRINTK is forced to y by another option; harmless because no console backend is enabled

# UART 비동기 API (EasyDMA로 전송) / UART async API (EasyDMA transfers)
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# CRC-16/XMODEM: crc16_itu_t(0, ...) / CRC helper
CONFIG_CRC=y

# 하트비트 LED / Heartbeat LED
CONFIG_GPIO=y
